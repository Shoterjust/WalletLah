services:
  postgres:
    image: postgres:16-alpine
    container_name: walletlah-postgres
    environment:
      POSTGRES_DB: walletlah
      POSTGRES_USER: walletlah
      POSTGRES_PASSWORD: walletlah
    ports:
      - "5432:5432"
    volumes:
      - walletlah-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletlah -d walletlah"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: walletlah-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/walletlah
      SPRING_DATASOURCE_USERNAME: walletlah
      SPRING_DATASOURCE_PASSWORD: walletlah
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      EMAIL_INGEST_ENABLED: ${EMAIL_INGEST_ENABLED:-false}
      EMAIL_INGEST_TOKEN: ${EMAIL_INGEST_TOKEN:-}
      RECEIPT_SCAN_ENABLED: ${RECEIPT_SCAN_ENABLED:-false}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RECEIPT_SCAN_MAX_FILE_SIZE_BYTES: ${RECEIPT_SCAN_MAX_FILE_SIZE_BYTES:-5000000}
      RECEIPT_SCAN_MIN_CONFIDENCE: ${RECEIPT_SCAN_MIN_CONFIDENCE:-70}
      RECEIPT_PENDING_EXPIRY_MINUTES: ${RECEIPT_PENDING_EXPIRY_MINUTES:-30}
      RECEIPT_SCAN_RATE_LIMIT_SECONDS: ${RECEIPT_SCAN_RATE_LIMIT_SECONDS:-20}
    ports:
      - "8080:8080"

volumes:
  walletlah-postgres-data:
