server:
  port: ${PORT:8080}

spring:
  application:
    name: walletlah
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/walletlah}
    username: ${SPRING_DATASOURCE_USERNAME:walletlah}
    password: ${SPRING_DATASOURCE_PASSWORD:walletlah}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info

walletlah:
  zone-id: ${WALLETLAH_ZONE_ID:Asia/Singapore}
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:false}
    token: ${TELEGRAM_BOT_TOKEN:}
  email-ingest:
    enabled: ${EMAIL_INGEST_ENABLED:false}
    token: ${EMAIL_INGEST_TOKEN:}
  dashboard:
    allowed-origins: ${DASHBOARD_ALLOWED_ORIGINS:http://localhost:3000}
    link-code-ttl-minutes: ${DASHBOARD_LINK_CODE_TTL_MINUTES:10}
  receipts:
    enabled: ${RECEIPT_SCAN_ENABLED:false}
    aws-region: ${AWS_REGION:ap-southeast-1}
    max-file-size-bytes: ${RECEIPT_SCAN_MAX_FILE_SIZE_BYTES:5000000}
    min-confidence: ${RECEIPT_SCAN_MIN_CONFIDENCE:70}
    pending-expiry-minutes: ${RECEIPT_PENDING_EXPIRY_MINUTES:30}
    rate-limit-seconds: ${RECEIPT_SCAN_RATE_LIMIT_SECONDS:20}
