server:
  port: ${PORT:8080}

spring:
  application:
    name: walletlah
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/walletlah}
    username: ${SPRING_DATASOURCE_USERNAME:walletlah}
    password: ${SPRING_DATASOURCE_PASSWORD:walletlah}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info

walletlah:
  zone-id: ${WALLETLAH_ZONE_ID:Asia/Singapore}
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:false}
    token: ${TELEGRAM_BOT_TOKEN:}
